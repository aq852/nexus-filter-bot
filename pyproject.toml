[project]
name = "nexus-filter-bot"
version = "0.1.0"
description = "Centrally managed Telegram file-search bot for public groups"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "aiogram>=3.20,<4.0",
  "motor>=3.7,<4.0",
  "pydantic-settings>=2.8,<3.0",
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.34,<1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.11"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
